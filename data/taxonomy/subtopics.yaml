# Taxonomy of question subtopics (draft 2, 2026-11-19; draft 1 was 2026-10-15).
#
# WHAT THIS IS: the list of things a benchmark (or training) question can be about. The script
# `code/generation/variety.py` deals these out to question slots like cards from a shuffled deck, so a
# subtopic is not used twice at the same difficulty until every subtopic in its list has been used once.
#
# HOW TO EDIT: add, remove or reword lines freely. Every line is one subtopic. Keep each one short and
# specific. Run `python code/generation/variety.py check` afterwards: it refuses duplicate area names and
# repeated subtopics within a category, counts the subtopics and tells you whether the list is big enough for
# the 1,150-slot benchmark (1,000 + 15% spares) with no repeats. Every change changes the file's SHA-256 hash,
# which is written into every slot file and run log, so we always know which taxonomy wrote which questions.
#
# SIZE RULE: in a 1,150-slot benchmark the slot pattern asks for at most about 115 questions of one category at
# one difficulty, so each category needs at least that many subtopics to avoid repeating a (subtopic,
# difficulty) pair. R interpretation is split 2:1 between number and short-text answers, and output
# interpretation has one slot per difficulty, so those lists can be shorter. `variety.py check` computes the
# exact requirement from the pattern.
#
# CHANGES IN DRAFT 2 (2026-11-19, approved by Jaxson 2026-11-19): the two r_generation areas both named
# "data frames" were merged into one (YAML silently kept only the second, dropping 16 subtopics); "arima or auto.arima" became
# "arima" (auto.arima is in the forecast package, not base R). Subtopics that appear in two DIFFERENT
# categories (for example "weighted mean" in numerical and in r_generation) are intended and kept.
#
# CONSTRAINT FOR R TOPICS: base R and the stats package only (no library()), plus built-in datasets
# (mtcars, iris, airquality, ToothGrowth, PlantGrowth, women, cars, faithful, USArrests, ChickWeight, trees).
#
# Each category lists areas (groups of related subtopics); the areas are used to spread the questions evenly
# over the whole field instead of letting one area dominate.

