# Paths for the masters project. All code should read paths from this file.
# Large, non-backed-up items live outside the repository. See recovery/ for rebuild instructions.
large_root: C:\masters_project_large
models_pythia: C:\masters_project_large\models\pythia
models_finetuned: C:\masters_project_large\models\finetuned
teacher_outputs: C:\masters_project_large\data\teacher_outputs
verified_data: C:\masters_project_large\data\verified
cache: C:\masters_project_large\cache
logs: C:\masters_project_large\logs
envs: C:\masters_project_large\envs
# R is installed outside the repository and is not on the PATH. Used to run answer-key checks.
rscript: C:\R-4.3.1\bin\Rscript.exe
# Redhawk cluster, the fallback (Linux paths, used by code and scripts that run on Redhawk; access: recovery/redhawk_ssh_access.md,
# cluster facts: docs/clusters/cluster_selection.md Section 7).
# CHOSEN 2026-11-04 from probe_cluster.sh: the home folder has a personal quota of 480 GB (500 GB hard limit) and 60 KB was
# in use; the 85% "full" figure was the whole shared disk (9.4 TB free). /scratch has no per-user quota but 86% full, no
# per-user folder and an unknown purge policy, so it was not used. Set all four together; the scripts and the Python code
# stop with a clear message if any is UNSET. fetch_weights.sh needs QT_ALLOW_HOME=yes because these paths are in $HOME.
redhawk_root: /home/buggjm/masters_project
redhawk_repo: /home/buggjm/masters_project/repo
redhawk_models: /home/buggjm/masters_project/models
redhawk_outputs: /home/buggjm/masters_project/teacher_outputs
# Talon cluster (Miami's H100 GPU cluster; Linux paths, used by configs/talon and by code that runs on Talon). Chosen 2026-11-06
# from the first probe: Talon and Redhawk SHARE one home folder (/home/buggjm) and one 500 GB quota (hard limit; soft limit 480 GB;
# OBSERVED with `quota -s -v -f /home`), so Talon uses its OWN folder inside it, never the Redhawk folder above. Because these
# folders are under the home folder, the download script needs QT_ALLOW_HOME=yes (the 500 GB is what Research Computing said is ours
# to use). Nothing is created until prep_talon.sh runs. Talon results are written under talon_outputs and never under
# redhawk_outputs; the code picks the key from the backend name. Set all four together.
talon_root: /home/buggjm/talon_project
talon_repo: /home/buggjm/talon_project/repo
talon_models: /home/buggjm/talon_project/models
talon_outputs: /home/buggjm/talon_project/teacher_outputs
